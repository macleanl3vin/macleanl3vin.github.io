# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This repo uses npm and commits package-lock.json, so the template's
      # package-manager detection step was dropped in favour of calling npm
      # directly — one less moving part in the build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # `static_site_generator: next` is deliberately not set. It rewrites the
        # Next config to inject a basePath, which this repo does not need — it
        # is a user site served from the domain root — and it is not reliable
        # against a TypeScript `next.config.ts`. Export settings are declared
        # explicitly in next.config.ts instead.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      # --legacy-peer-deps: the dev-only lint toolchain contains an
      # unsatisfiable peer edge — eslint-config-next pulls tinyglobby -> fdir,
      # which peer-requires picomatch ^3 || ^4, while fast-glob -> micromatch
      # hoists picomatch 2.x to the root. npm tolerates this on some platforms
      # and rejects it on others ("lock file's picomatch@2.3.2 does not satisfy
      # picomatch@4.0.5"). None of it is used by `next build`, so the peer
      # check is not worth failing a deploy over. Still an exact,
      # lockfile-pinned install.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build with Next.js
        run: npx --no-install next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
